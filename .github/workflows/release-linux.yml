name: Attach Linux binary to release

# The macOS app can't ship prebuilt (each install is locally signed — see
# README "Code signing"), but the Linux CLI has no signing constraint: it's a
# fully static musl binary that runs on any x86_64 distro. Building it here on
# every published release lets Linux users skip the ~1.5 GB toolchain
# download; they only clone the repo if they want the Plasma widget.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-binary:
    runs-on: ubuntu-latest
    # Toolchain and Static SDK versions must match exactly, so both are
    # pinned. Keep in sync with SWIFT_VERSION in linux/build.sh when bumping.
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Static Linux SDK
        run: |
          swift sdk install \
            "https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz" \
            --checksum 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
      - name: Build static binary
        run: swift build -c release --swift-sdk x86_64-swift-linux-musl
      - name: Strip and attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
        run: |
          cp .build/release/ClaudeUsage claude-usage-linux-x86_64
          strip claude-usage-linux-x86_64
          ./claude-usage-linux-x86_64 --help >/dev/null 2>&1 || { echo "stripped binary broken" >&2; exit 1; }
          curl -sf -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @claude-usage-linux-x86_64 \
            "${UPLOAD_URL%\{*}?name=claude-usage-linux-x86_64"
